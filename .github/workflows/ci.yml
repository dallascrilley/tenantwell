name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + isolation proofs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenantwell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenantwell"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # The GitHub-hosted service publishes on 5432; docker-compose uses 5433.
      PGHOST: localhost
      PGPORT: 5432

    steps:
      - uses: actions/checkout@v4

      # version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test
